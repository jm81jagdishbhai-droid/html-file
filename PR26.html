<!DOCTYPE html>
<html>
<body>
<h1>Java script Functions</h1>
<h2>Function Sequence</h2>
<p>Javascript functions are executed in the sequence they are called.</p>
<p id="pr"></p>
<script>
 function myDisplayer(some){
    document.getElementById("pr").innerHTML+=some+"";
}
 
 function myFirst(){
   myDisplayer("Hello I am Mihir");
}
 
 function mySecond(){
    myDisplayer("How are you");
}

myFirst();
mySecond();
</script>
</body>
</html>
