<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple API Project</title>

<style>
  body {
    font-family: Arial;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
  }

  .container {
    max-width: 700px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
  }

  h1 {
    text-align: center;
  }

  .form {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }

  input {
    flex: 1;
    padding: 10px;
  }

  button {
    padding: 10px;
    border: none;
    cursor: pointer;
    background: #007bff;
    color: white;
    border-radius: 5px;
  }

  .load-btn {
    width: 100%;
    margin-bottom: 15px;
    background: green;
  }

  .user {
    display: flex;
    justify-content: space-between;
    background: #eee;
    margin: 10px 0;
    padding: 10px;
    border-radius: 5px;
  }

  .delete {
    background: red;
  }
</style>
</head>

<body>

<div class="container">
  <h1>👤 Simple API Demo</h1>

  <div class="form">
    <input type="text" id="name" placeholder="Name">
    <input type="email" id="email" placeholder="Email">
    <button onclick="addUser()">Add</button>
  </div>

  <button class="load-btn" onclick="loadUsers()">Load Users</button>

  <div id="users"></div>
</div>

<script>
const API = "https://jsonplaceholder.typicode.com/users";

// 📌 GET USERS
async function loadUsers() {
  const res = await fetch(API);
  const data = await res.json();

  const container = document.getElementById("users");
  container.innerHTML = "";

  data.forEach(user => {
    const div = document.createElement("div");
    div.className = "user";

    div.innerHTML = `
      <span>${user.name} - ${user.email}</span>
      <button class="delete" onclick="deleteUser(${user.id})">X</button>
    `;

    container.appendChild(div);
  });
}

// 📌 ADD USER (fake API)
async function addUser() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;

  if (!name || !email) {
    alert("Fill all fields");
    return;
  }

  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ name, email }),
    headers: {
      "Content-Type": "application/json"
    }
  });

  const data = await res.json();
  console.log("Added:", data);

  alert("User added (fake API)");
  loadUsers();
}

// 📌 DELETE USER (fake API)
async function deleteUser(id) {
  await fetch(`${API}/${id}`, {
    method: "DELETE"
  });

  alert("User deleted (fake API)");
  loadUsers();
}
</script>

</body>
</html>
