<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async JavaScript Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #users {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.1);
        }

        .loading {
            text-align: center;
            font-size: 20px;
            color: blue;
        }

        .error {
            text-align: center;
            color: red;
            font-size: 20px;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Async JavaScript Website</h1>

    <button onclick="loadUsers()">Load Users</button>

    <div id="message"></div>
    <div id="users"></div>

    <script>
        async function loadUsers() {

            const usersDiv = document.getElementById("users");
            const messageDiv = document.getElementById("message");

            usersDiv.innerHTML = "";
            messageDiv.innerHTML = "<p class='loading'>Loading data...</p>";

            try {

                // Asynchronous API request
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                // Check response
                if (!response.ok) {
                    throw new Error("Failed to fetch data");
                }

                // Convert response to JSON
                const users = await response.json();

                messageDiv.innerHTML = "";

                // Display users
                users.forEach(user => {

                    const card = document.createElement("div");
                    card.className = "card";

                    card.innerHTML = `
                        <h3>${user.name}</h3>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>City:</strong> ${user.address.city}</p>
                        <p><strong>Phone:</strong> ${user.phone}</p>
                    `;

                    usersDiv.appendChild(card);
                });

            } catch (error) {

                messageDiv.innerHTML = `
                    <p class="error">${error.message}</p>
                `;

                console.error(error);
            }
        }
    </script>

</body>
</html>
