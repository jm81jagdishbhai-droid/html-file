* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f4f7ff;
}

/* Main Container */
.container {
  width: 100%;
  min-height: 100vh;
}

/* Header */
.header {
  width: 100%;
  padding: 20px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;

  background: linear-gradient(
    90deg,
    #ff6b6b,
    #ff9f43,
    #feca57,
    #1dd1a1,
    #54a0ff,
    #5f27cd
  );

  color: white;
}

.header h1 {
  font-size: 32px;
  font-weight: bold;
}

.header nav a {
  margin-left: 25px;
  text-decoration: none;
  color: white;
  font-size: 18px;
  transition: 0.3s;
}

.header nav a:hover {
  color: yellow;
}

/* Hero Section */
.hero {
  height: 85vh;

 background: linear-gradient(
    rgba(255, 255, 255, 0.4),
    rgba(255, 255, 255, 0.4)
  )
  
      
    url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1400");

  background-size: cover;
  background-position: center;

  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;

  color: white;
}

.hero-content h2 {
  font-size: 60px;
  margin-bottom: 20px;
}

.hero-content p {
  font-size: 22px;
  margin-bottom: 25px;
}

.hero-content button {
  padding: 14px 35px;
  border: none;
  border-radius: 40px;
  background: linear-gradient(45deg, #ff0080, #ff8c00);
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: 0.4s;
}

.hero-content button:hover {
  transform: scale(1.1);
}

/* Products */
.products {
  padding: 70px 50px;
}

.title {
  text-align: center;
  font-size: 42px;
  margin-bottom: 50px;
  color: #333;
}

/* Product Grid */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 35px;
}

/* Card */
.card {
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);

  transition: 0.4s;
}

.card:hover {
  transform: translateY(-10px);
}

.card img {
  width: 100%;
  height: 320px;
  object-fit: cover;
}

.card h3 {
  padding: 15px;
  font-size: 26px;
  color: #222;
}

.card p {
  padding: 0 15px;
  font-size: 20px;
  color: #ff0080;
  font-weight: bold;
}

.card button {
  margin: 20px 15px;
  padding: 12px 22px;
  border: none;
  border-radius: 30px;

  background: linear-gradient(45deg, #00c6ff, #0072ff);

  color: white;
  font-size: 17px;
  cursor: pointer;
  transition: 0.4s;
}

.card button:hover {
  background: linear-gradient(45deg, #ff0080, #ff8c00);
}

/* Footer */
.footer {
  text-align: center;
  padding: 25px;
  background: linear-gradient(
    90deg,
    #5f27cd,
    #341f97,
    #ff0080
  );
  color: white;
  font-size: 18px;
