<!DOCTYPE html>
<html>
<body>
<h1>JavaScript async/ await</h1>

<p id ="pr"></p>
<script>

//Function to display to something
function myDisplayer(some) {
  document.getElementById("pr").innerHTML = some;
}
//Three functions to run steps
function step1() {
  return Promise.resolve("A");
}
function step2(value) {
  return Promise.resolve(value + "B");
}
function step3(value) {
  return Promise.resolve(value + "C");
}
//Functions to run three functions in steps
async function run() {
  let v1 = await step1();
  let v2 = await step2(v1);
  let v3 = await step3(v2);
  myDisplayer(v3);
}

run();

</script>
</body>
</html>
