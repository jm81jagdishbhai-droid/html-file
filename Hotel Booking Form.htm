@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
/* App.css */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}
/* Main Container */
.container {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px;
}
/* Booking Card */
.booking-card {
  width: 430px;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(15px);
  padding: 35px;
  border-radius: 25px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.35),
    inset 0 0 10px rgba(255, 255, 255, 0.08);
  animation: fadeIn 1s ease;
  transition: 0.4s;
}
.booking-card:hover {
  transform: translateY(-5px);
}
/* Heading */
.booking-card h1 {
  text-align: center;
  color: white;
  margin-bottom: 30px;
  font-size: 32px;
  font-weight: 600;
  letter-spacing: 1px;
}
/* Form */
form {
  display: flex;
  flex-direction: column;
}
/* Inputs */
input,
select {
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 18px;
  border: none;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.18);
  color: white;
  font-size: 15px;
  outline: none;
  transition: 0.3s ease;
  border: 2px solid transparent;
}
input::placeholder {
  color: rgba(255, 255, 255, 0.75);
}
/* Select Option */
select option {
  color: black;
}
/* Focus Effect */
input:focus,
select:focus {
  border-color: #38bdf8;
  background: rgba(255, 255, 255, 0.25);
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
  transform: scale(1.02);
}
/* Labels */
label {
  color: white;
  margin-bottom: 8px;
  font-size: 14px;
  font-weight: 500;
}
/* Button */
button {
  margin-top: 10px;
  padding: 15px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #06b6d4, #3b82f6);
  color: white;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.4s ease;
  letter-spacing: 0.5px;
  box-shadow: 0 5px 18px rgba(59, 130, 246, 0.4);
}
/* Hover Button */
button:hover {
  transform: scale(1.05);
  background: linear-gradient(135deg, #3b82f6, #06b6d4);
  box-shadow: 0 8px 24px rgba(59, 130, 246, 0.6);
}
/* Booking Output */
.output {
  margin-top: 25px;
  padding: 20px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.15);
  border-left: 5px solid #22c55e;
  animation: slideUp 0.6s ease;
}
.output h2 {
  color: #4ade80;
  margin-bottom: 14px;
  font-size: 24px;
}
.output p {
  color: white;
  margin: 8px 0;
  font-size: 15px;
}
/* Animations */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-25px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(25px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}
/* Responsive */
@media (max-width: 500px) {
  .booking-card {
    width: 100%;
    padding: 25px;
  }

  .booking-card h1 {
    font-size: 26px;
  }

  button {
    font-size: 16px;
  }
}</style></head>
