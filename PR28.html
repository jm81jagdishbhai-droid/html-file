<!DOCTYPE html>
<html>
<body>
<h1>Java script promises</h1>
<h2>The .then()Method</h2>

<p id="pr"></p>
<script>
//Function to display something    
function myDisplayer(some){
  document.getElementById("PR").innerHTML=some;
}
// Create promise object
let myPromise =new Promise(function(resolve,reject){
   ok= true;
// code that might take some time 
  if (ok) {
    resolve("ok");
  }else{
    reject("error");
  }
});
//Using then() to display the result
myPromise.then(
  function(value){myDisplayer(value)},
  function(value){myDisplayer(value)}
);
</script>
</body>
</html>
